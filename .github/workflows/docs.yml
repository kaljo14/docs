name: Check and publish documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - run: npm run build

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      MAP_INFRA_DISPATCH_TOKEN: ${{ secrets.MAP_INFRA_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push docs
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            kaljo14/docs:latest
            kaljo14/docs:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Notify map-infra about the new image
        if: env.MAP_INFRA_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.MAP_INFRA_DISPATCH_TOKEN }}
        run: |
          gh api --method POST repos/kaljo14/map-infra/dispatches \
            -f event_type=image-pushed
